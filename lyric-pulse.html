<title>Lyric Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: the 9:16 lyric stage fills the screen. A DJ board peeks out at the bottom; opening it pans the camera up so the lyrics stay visible above the board. */
:root {
  /* Color: pure black stage, violet-tinted metal, hot pink accent. The LED color follows loudness: violet (quiet) to pink-orange (loud). */
  --bg: #000;
  --panel: #0b0911;
  --panel-2: #141020;
  --line: #2a2239;
  --fg: #f2eefc;
  --muted: #a097bb;
  --accent: #ff3d9a;
  --accent-ink: #17020c;
  --violet: #9b82ff;
  --danger: #ff8f8f;
  --led: #b04dff;
  --spill: rgba(176, 77, 255, .18);
  --peek: 52px;
  /* Type: Bricolage Grotesque (variable weight, also drives the lyrics) and DM Mono for silkscreen labels and readouts. */
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0;
  overflow: hidden;
  color: var(--fg);
  font: 400 15px/1.5 var(--display);
  padding-block: 16px calc(var(--peek) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- camera + stage ---- */
.cam {
  height: 100%;
  display: flex; justify-content: center; align-items: stretch;
  transform-origin: 50% 47%;
  transition: transform .8s cubic-bezier(.2, .9, .25, 1);
}
body.open .cam { transform: translateY(var(--lift, 0px)) scale(.94); }
.stage {
  position: relative;
  flex: 0 1 auto; min-width: 0;
  height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.stage:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
.stage canvas { display: block; width: 100%; height: 100%; }

body.clean .cam { transform: none; transition: none; }
body.clean .stage { position: fixed; inset: 0; width: auto; height: auto; max-width: none; aspect-ratio: auto; border: 0; border-radius: 0; z-index: 10; }
body.clean .deck { display: none; }

.exit {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px));
  z-index: 40;
  padding: 0 16px;
  opacity: 0;
  transition: opacity .3s;
}
.exit.show, .exit:focus-visible { opacity: 1; }

/* ---- the DJ board ---- */
.deck {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  max-height: 88%;
  display: flex; flex-direction: column;
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  border-top: 1px solid #3a2f52;
  border-radius: 18px 18px 0 0;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .05), transparent 36%),
    repeating-linear-gradient(115deg, rgba(255, 255, 255, .02) 0 2px, transparent 2px 5px),
    #0a0810;
  box-shadow: 0 -22px 60px -14px var(--spill), 0 -1px 0 #000;
  transform: translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom, 0px)));
  transition: transform .8s cubic-bezier(.2, .9, .25, 1);
}
body.open .deck { transform: none; }

.grip {
  position: relative; flex: none;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: var(--peek); padding: 3px 0 0;
  border: 0; background: transparent; color: var(--fg);
  font: inherit; cursor: pointer;
}
.grip:focus-visible { outline: 2px solid var(--violet); outline-offset: -4px; }
.strip {
  position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--violet), var(--accent), #ff8a3d, var(--accent), var(--violet));
  background-size: 200% 100%;
  box-shadow: 0 0 16px var(--led);
  animation: slide 6s linear infinite;
}
@keyframes slide { to { background-position: -200% 0; } }
.grip-tx { display: inline-flex; align-items: center; gap: 10px; font: 500 11px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.chev { transition: transform .6s; }
body.open .chev { transform: rotate(180deg); }

.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 30%, #4a3f63, #15101f); box-shadow: 0 0 0 1px #000; }
.screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1px; background: #05030a; transform: rotate(35deg); }
.screw.a { top: calc(var(--peek) + 8px); left: 10px; }
.screw.b { top: calc(var(--peek) + 8px); right: 10px; }
.screw.c { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 10px; }
.screw.d { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); right: 10px; }

.deck-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  visibility: hidden; transition: visibility 0s .8s;
}
body.open .deck-body { visibility: visible; transition-delay: 0s; }
.deck-in { max-width: 1000px; margin: 0 auto; padding-block: 10px 18px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

.booth {
  --s: 84px;
  display: grid; gap: 14px; align-items: start;
  grid-template-columns: var(--s) minmax(0, 1fr) var(--s);
  grid-template-areas: "pl vu pr" "wave wave wave" "trans trans trans" "load load load" "screen screen screen" "fader fader fader";
}
@media (min-width: 860px) {
  .booth {
    --s: 190px; gap: 16px 22px;
    grid-template-areas: "pl vu pr" "trans wave load" "trans screen load" "trans fader load";
  }
}
.pl { grid-area: pl; } .pr { grid-area: pr; } .vu { grid-area: vu; } .wave { grid-area: wave; }
.trans { grid-area: trans; } .load { grid-area: load; } .screen { grid-area: screen; } .fader { grid-area: fader; }
.pl, .pr { display: grid; justify-items: center; gap: 6px; }
.vu { justify-self: center; width: 96px; height: var(--s); }

/* platters */
.platter { position: relative; width: var(--s); aspect-ratio: 1; border-radius: 50%; }
.platter::before {
  content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 50%;
  background: #07050b; border: 2px solid #2a2239;
  box-shadow: 0 0 0 3px #120e1b, 0 0 calc(var(--s) * .16) var(--led), inset 0 0 14px #000;
}
.platter::after {
  content: ""; position: absolute; inset: 6%; z-index: 2; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, transparent 0 30%, rgba(255, 255, 255, .09) 38%, transparent 46% 80%, rgba(255, 255, 255, .07) 88%, transparent 96%);
}
.disc {
  position: absolute; inset: 6%; z-index: 1; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, #17121f 0 1.5px, #0a0810 1.5px 3.5px);
  box-shadow: inset 0 0 0 2px #000;
}
.disc .lab { position: absolute; inset: 32%; border-radius: 50%; background: conic-gradient(from 20deg, var(--violet), var(--accent), #ff8a3d, var(--accent), var(--violet)); }
.disc .lab::after { content: ""; position: absolute; inset: 41%; border-radius: 50%; background: #05030a; }
.disc .mark { position: absolute; left: 50%; top: 5%; width: 3px; height: 13%; margin-left: -1.5px; border-radius: 2px; background: #fff; opacity: .85; }
.silk { font: 500 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

/* pads */
.pads { display: grid; gap: 8px; align-content: start; }
.pads.trans { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pads.load { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 860px) { .pads.trans { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pad {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 8px;
  font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--fg); background: linear-gradient(180deg, #1f1a2c, #130f1c);
  border: 1px solid #33284a; border-radius: 9px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 3px 0 #05030a;
  cursor: pointer; text-align: center;
  transition: transform .08s, box-shadow .08s, border-color .15s;
}
.pad:hover { border-color: #5a4b78; }
.pad:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 1px 0 #05030a; }
.pad:focus-visible, .pad:focus-within { outline: 2px solid var(--violet); outline-offset: 2px; }
.pad .led { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #2a2239; }
.pad.on .led { background: var(--led); box-shadow: 0 0 8px var(--led); }
.pad.hot { background: linear-gradient(180deg, #ff5aa9, #e32a80); color: var(--accent-ink); border-color: #ff8fc4; }
.pad.hot .led { background: rgba(23, 2, 12, .35); }
.pad.hot.on { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 3px 0 #05030a, 0 0 24px rgba(255, 61, 154, .6); }
.pad.hot.on .led { background: #fff; box-shadow: 0 0 8px #fff; }
.pad.sm { min-height: 40px; padding: 0 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }
.status { grid-column: 1 / -1; margin: 2px 0 0; font: 400 11px/1.55 var(--mono); color: var(--muted); }
.status.err { color: var(--danger); }
.tip { grid-column: 1 / -1; margin: 0; font: 400 11px/1.55 var(--mono); color: var(--muted); }

/* waveform display */
.lcd {
  --tlh: 56px;
  position: relative; height: var(--tlh); overflow: hidden;
  background: #05030a; border: 1px solid #33284a; border-radius: 8px;
  box-shadow: inset 0 0 18px rgba(0, 0, 0, .9);
}
@media (min-width: 860px) { .lcd { --tlh: 72px; } }
.lcd canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lcd::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px); }
.lcd input {
  position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0;
  background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.lcd:focus-within { outline: 2px solid var(--violet); outline-offset: 2px; }
.lcd input:focus { outline: none; }
.lcd input::-webkit-slider-runnable-track { height: 100%; background: transparent; }
.lcd input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: var(--tlh); border: 0; border-radius: 0;
  background: linear-gradient(90deg, transparent 4px, #fff 4px, #fff 7px, transparent 7px);
}
.lcd input::-moz-range-track { height: 100%; background: transparent; }
.lcd input::-moz-range-thumb {
  width: 12px; height: var(--tlh); border: 0; border-radius: 0;
  background: linear-gradient(90deg, transparent 4px, #fff 4px, #fff 7px, transparent 7px);
}
.time { display: flex; justify-content: space-between; margin-top: 6px; font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* lyrics screen */
.shead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
textarea {
  display: block; width: 100%; min-height: 92px; resize: vertical;
  padding: 10px 12px; color: #dcd0ff; caret-color: var(--accent);
  background: #05030a; border: 1px solid #33284a; border-radius: 8px;
  box-shadow: inset 0 0 18px rgba(0, 0, 0, .9);
  font: 400 12.5px/1.65 var(--mono);
}
textarea:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
@media (min-width: 860px) { textarea { min-height: 110px; } }
.hint { margin: 8px 0 0; font: 400 11px/1.55 var(--mono); color: var(--muted); }

/* pop fader */
.fhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.fhead label { font: 500 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.fhead output { font: 500 12px/1 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.fader input {
  --p: 33%;
  display: block; width: 100%; height: 34px; margin: 0; background: transparent;
  -webkit-appearance: none; appearance: none; cursor: pointer;
}
.fader input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 6px; }
.fader input::-webkit-slider-runnable-track {
  height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--accent) var(--p), #1a1524 var(--p));
  box-shadow: inset 0 1px 3px #000, 0 0 14px -3px rgba(255, 61, 154, .6);
}
.fader input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 30px; height: 30px; margin-top: -11px;
  border: 1px solid #6a5a8c; border-radius: 6px;
  background: linear-gradient(90deg, transparent 13px, #fff 13px, #fff 17px, transparent 17px), linear-gradient(180deg, #3d3254, #1a1524);
  box-shadow: 0 4px 10px rgba(0, 0, 0, .7);
}
.fader input::-moz-range-track { height: 8px; border-radius: 4px; background: #1a1524; box-shadow: inset 0 1px 3px #000; }
.fader input::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--accent); }
.fader input::-moz-range-thumb {
  width: 30px; height: 30px; border: 1px solid #6a5a8c; border-radius: 6px;
  background: linear-gradient(90deg, transparent 13px, #fff 13px, #fff 17px, transparent 17px), linear-gradient(180deg, #3d3254, #1a1524);
  box-shadow: 0 4px 10px rgba(0, 0, 0, .7);
}
.ticks { height: 6px; margin: 2px 15px 0; background: repeating-linear-gradient(90deg, #3b3052 0 1px, transparent 1px 6.6667%); }

@media (prefers-reduced-motion: reduce) {
  .strip { animation: none; }
  .cam, .deck, .chev, .pad, .exit { transition: none; }
}
</style>

<div class="cam" id="cam">
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Lyric stage. Press to play or pause.">
    <canvas id="cv" aria-hidden="true"></canvas>
  </div>
</div>

<aside class="deck" id="deck" aria-label="DJ board">

          <textarea id="lyrics" spellcheck="false"></textarea>

        </div>

      </div>
    </div>
  </div>
</aside>

<button class="pad exit" id="exitClean" type="button" hidden>Exit clean view</button>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutBack = t => 1 + 3.4 * Math.pow(t - 1, 3) + 2.4 * Math.pow(t - 1, 2);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const FONT = '"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif';
const MONO = '"DM Mono", ui-monospace, Menlo, monospace';
const hueOf = l => (250 + l * 125) % 360;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const stage = $('stage'), cam = $('cam'), cv = $('cv'), g = cv.getContext('2d', { alpha: false });
const tl = $('tl'), tg = tl.getContext('2d'), vu = $('vu'), vg = vu.getContext('2d');
const deck = $('deck'), grip = $('grip'), discL = $('discL'), discR = $('discR');
const seek = $('seek'), lyricsEl = $('lyrics'), statusEl = $('status');
const playBtn = $('playBtn'), playIc = $('playIc'), playTx = $('playTx'), restartBtn = $('restartBtn'), soundBtn = $('soundBtn');
const cleanBtn = $('cleanBtn'), exitBtn = $('exitClean'), demoBtn = $('demoBtn');
const fileIn = $('songFile'), applyBtn = $('applyBtn'), popEl = $('pop'), popOut = $('popOut');

const ICON_PLAY = '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/></svg>';

/* ---------- state ---------- */
let W = 360, H = 640, dpr = 1, epoch = 0, time = 0, last = performance.now(), flow = 0, spin = 0;
let ctx = null, gain = null, soundOn = true;
let track = null, src = null, playing = false, startCtx = 0, startOff = 0, pausedAt = 0;
let lines = [], strength = 1, live = 0, prevTarget = 0, lastRing = -9, shake = 0;
let shownIdx = -1, ghost = null, lastT = 0, lastSec = -1, scrubbing = false, wasPlaying = false;
const rings = [], parts = [];
const rand = rng(7);
const orbs = Array.from({ length: 14 }, () => ({ x: rand(), sp: 0.015 + rand() * 0.035, ph: rand(), sz: rand(), hs: rand() * 70 - 35 }));

/* ---------- demo track (made in the browser, original words) ---------- */
const DEMO_BPM = 112, DEMO_BAR = 240 / DEMO_BPM;
const DEMO_LEVELS = [1, 1, .3, .3, .3, .3, .55, .55, .7, .7, .3, .3, 1, 1, 1, .6];
const DEMO_WORDS = ['TURN IT UP', 'FEEL THE FLOOR', 'soft light on the glass', 'the whole street holds its breath',
  'nobody says a word', 'just the hum beneath the night', "something's coming closer", 'I can feel it in my chest',
  'LOUDER NOW', 'THE WHOLE SKY SHAKES', 'and then it all goes still', 'waiting for the spark',
  'NOW SCREAM IT OUT', 'BURN THE NIGHT DOWN', 'WE ARE LOUD', 'WE ARE ALIVE'];
const lrcTime = t => { const m = Math.floor(t / 60), s = t - m * 60; return '[' + String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0') + ']'; };
const demoLrc = DEMO_WORDS.map((l, i) => lrcTime(i * DEMO_BAR + 0.05) + ' ' + l).join('\n');
let demo = null;
function getDemo() {
  if (demo) return demo;
  const sr = 44100, dur = DEMO_LEVELS.length * DEMO_BAR, n = Math.floor(dur * sr), d = new Float32Array(n);
  const beat = 60 / DEMO_BPM, roots = [55, 55, 65.41, 49];
  let seed = 1;
  const noise = () => { seed = (seed * 16807) % 2147483647; return seed / 1073741823 - 1; };
  for (let i = 0; i < n; i++) {
    const t = i / sr, bar = Math.min(DEMO_LEVELS.length - 1, Math.floor(t / DEMO_BAR)), lv = DEMO_LEVELS[bar];
    const bp = t % beat, ob = (t + beat / 2) % beat;
    const kick = Math.sin(6.2832 * (55 * bp + (110 / 30) * (1 - Math.exp(-30 * bp)))) * Math.exp(-bp * 11) * lv;

});
popEl.addEventListener('input', () => {
  strength = +popEl.value; popOut.textContent = strength.toFixed(1) + '×'; epoch++;
  popEl.style.setProperty('--p', ((strength - 0.5) / 1.5 * 100) + '%');
});
fileIn.addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  setStatus('Reading ' + f.name + '…');
  try {
    const raw = await f.arrayBuffer();
    const ab = await getCtx().decodeAudioData(raw);
    const chs = Array.from({ length: ab.numberOfChannels }, (_, i) => ab.getChannelData(i));
    const keep = lyricsEl.value.trim() && lyricsEl.value !== demoLrc;
    setTrack({ name: f.name, duration: ab.duration, ab, chs, sr: ab.sampleRate }, keep ? undefined : '');
    setStatus(f.name + ' · ' + fmt(ab.duration) + (keep ? '' : ' · paste its lyrics below, then press Apply'));
  } catch (err) {
    setStatus('Could not read that file. Try an MP3, M4A or WAV.', true);
  }
  fileIn.value = '';
});

seek.addEventListener('pointerdown', () => { scrubbing = true; wasPlaying = playing; if (playing) pause(); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; resetFlags(); if (wasPlaying) play(); };
seek.addEventListener('pointerup', endScrub);
seek.addEventListener('pointercancel', endScrub);
seek.addEventListener('input', () => { const v = +seek.value; if (scrubbing) pausedAt = v; else seekTo(v); });

let exitTimer = 0;
function showExit() {
  exitBtn.classList.add('show'); clearTimeout(exitTimer);
  exitTimer = setTimeout(() => exitBtn.classList.remove('show'), 2500);
}
function setClean(on) {
  if (on) setDeck(false);
  document.body.classList.toggle('clean', on);
  exitBtn.hidden = !on;
  if (on) { window.scrollTo(0, 0); showExit(); }
  else { clearTimeout(exitTimer); exitBtn.classList.remove('show'); computeCols(); sizeVU(); }
}
cleanBtn.addEventListener('click', () => setClean(true));
exitBtn.addEventListener('click', () => setClean(false));
stage.addEventListener('click', () => { togglePlay(); if (clean()) showExit(); });
stage.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePlay(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (clean()) setClean(false); else if (document.body.classList.contains('open')) setDeck(false);
});

/* ---------- start ---------- */
resize();
sizeVU();
popEl.style.setProperty('--p', ((strength - 0.5) / 1.5 * 100) + '%');
const d0 = getDemo();
setTrack(d0, demoLrc);
setStatus('Demo track · ' + fmt(d0.duration) + ' · made in your browser with original words');
Promise.all([document.fonts.load('300 40px "Bricolage Grotesque"'), document.fonts.load('800 40px "Bricolage Grotesque"'), document.fonts.load('500 12px "DM Mono"')])
  .then(() => { epoch++; }).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
