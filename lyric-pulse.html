<title>Lyric Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: we stand in the DJ booth looking out at the crowd; the 9:16 lyric stage is that view. The DJ board lies just below our eyeline with its far edge barely in sight. Opening it glides the camera down to hover over the board, and the lyrics stay visible above it. */
:root {
  /* Color: pure black stage, violet-tinted metal, hot pink accent. The LED color follows loudness: violet (quiet) to pink-orange (loud). */
  --bg: #000;
  --panel: #0b0911;
  --panel-2: #141020;
  --line: #2a2239;
  --fg: #f2eefc;
  --muted: #a097bb;
  --accent: #ff3d9a;
  --accent-ink: #17020c;
  --violet: #9b82ff;
  --danger: #ff8f8f;
  --led: #b04dff;
  --spill: rgba(176, 77, 255, .18);
  --peek: 66px;
  --grip: 46px;
  /* Camera: the crowd view and the board share one perspective. Closed, the board lies almost flat below us; open, it tips up under a camera hovering over it. */
  --persp: max(1000px, 125vh);
  --tilt-closed: 66deg;
  --tilt-open: 9deg;
  --cam-tilt: -8deg;
  --glide: 1.1s cubic-bezier(.65, 0, .2, 1);
  /* Type: Bricolage Grotesque (variable weight, also drives the lyrics) and DM Mono for silkscreen labels and readouts. */
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0;
  overflow: hidden;
  color: var(--fg);
  font: 400 15px/1.5 var(--display);
}

/* ---- the room: one perspective for the crowd view and the board ---- */
.world {
  position: fixed; inset: 0; overflow: hidden;
  perspective: var(--persp); perspective-origin: 50% 58%;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(var(--peek) + 14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(80% 50% at 50% 100%, #150f22, #000 70%);
}

/* ---- camera + stage ---- */
.cam {
  height: 100%;
  display: flex; justify-content: center; align-items: stretch;
  transform-origin: 50% 47%;
  transition: transform var(--glide);
}
body.open .cam { transform: translateY(var(--lift, 0px)) rotateX(var(--cam-tilt)) scale(.9); }
.stage {
  position: relative;
  flex: 0 1 auto; min-width: 0;
  height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 30px 90px -40px rgba(155, 130, 255, .45);
}
.stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent 45%, rgba(0, 0, 0, .55));
  opacity: 0; transition: opacity var(--glide);
}
body.open .stage { animation: drift 6s ease-in-out 1.1s infinite; }
body.open .stage::after { opacity: 1; }
@keyframes drift { 50% { transform: translateY(-4px) rotate(.2deg); } }
.stage:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
.stage canvas { display: block; width: 100%; height: 100%; }

body.clean .cam { transform: none; transition: none; }
body.clean .stage { position: fixed; inset: 0; width: auto; height: auto; max-width: none; aspect-ratio: auto; border: 0; border-radius: 0; z-index: 10; box-shadow: none; }
body.clean .deck { display: none; }

.exit {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px));
  z-index: 40;
  padding: 0 16px;
  opacity: 0;
  transition: opacity .3s;
}
.exit.show, .exit:focus-visible { opacity: 1; }

/* ---- the DJ board ---- */
.deck {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  width: min(100%, 1120px); max-height: 74%; margin-inline: auto;
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  border-radius: 20px 20px 0 0;
  background:
    radial-gradient(120% 40% at 50% 0%, rgba(155, 130, 255, .1), transparent 70%),
    linear-gradient(180deg, rgba(255, 255, 255, .06), transparent 18%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px),
    #0b0911;
  box-shadow: 0 -24px 70px -16px var(--spill), inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px #2c2340;
  transform-origin: 50% 0;
  /* closed: hinged on its far edge and laid nearly flat. open: hinged on its near edge, tipped up toward us */
  transform: translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom, 0px))) rotateX(var(--tilt-closed)) translateY(0);
  transition: transform var(--glide);
  cursor: pointer;
}
body.open .deck { transform: translateY(100%) rotateX(var(--tilt-open)) translateY(-100%); cursor: auto; }
@media (min-width: 860px) { .deck { max-height: 80%; } }

.grip {
  position: relative; flex: none;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: var(--grip); padding: 5px 0 0;
  border: 0; border-radius: 20px 20px 0 0; background: transparent; color: var(--fg);
  font: inherit; cursor: pointer;
}
.grip:focus-visible { outline: 2px solid var(--violet); outline-offset: -4px; }
.strip {
  position: absolute; left: 14px; right: 14px; top: 0; height: 4px; border-radius: 0 0 4px 4px;
  background: linear-gradient(90deg, var(--violet), var(--accent), #ff8a3d, var(--accent), var(--violet));
  background-size: 200% 100%;
  box-shadow: 0 0 18px var(--led), 0 0 4px var(--led);
  animation: slide 6s linear infinite;
}
@keyframes slide { to { background-position: -200% 0; } }
.grip-tx {
  display: inline-flex; align-items: center; gap: 12px;
  font: 500 13px/1 var(--mono); letter-spacing: .26em; text-transform: uppercase; color: #cfc5ea;
  text-shadow: 0 1px 0 #000, 0 0 14px rgba(155, 130, 255, .5);
}
.grip:hover .grip-tx { color: var(--fg); }
.chev { transition: transform .6s; }
body.open .chev { transform: rotate(180deg); }

.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 30%, #5a4f75, #15101f); box-shadow: 0 0 0 1px #000, 0 1px 1px rgba(255, 255, 255, .08); }
.screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1px; background: #05030a; transform: rotate(35deg); }
.screw.a { top: calc(var(--grip) + 4px); left: 10px; }
.screw.b { top: calc(var(--grip) + 4px); right: 10px; }
.screw.c { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 10px; }
.screw.d { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); right: 10px; }

.deck-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #3a2f52 transparent; }
.deck-in { max-width: 1000px; margin: 0 auto; padding-block: 8px 22px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

.booth {
  --s: 84px;
  display: grid; gap: 16px 14px; align-items: start;
  grid-template-columns: var(--s) minmax(0, 1fr) var(--s);
  grid-template-areas: "pl vu pr" "wave wave wave" "trans trans trans" "load load load" "screen screen screen" "fader fader fader";
}
@media (min-width: 860px) {
  .booth {
    --s: 190px; gap: 18px 26px;
    grid-template-areas: "pl vu pr" "trans wave load" "trans screen load" "trans fader load";
  }
}
.pl { grid-area: pl; } .pr { grid-area: pr; } .vu { grid-area: vu; } .wave { grid-area: wave; }
.trans { grid-area: trans; } .load { grid-area: load; } .screen { grid-area: screen; } .fader { grid-area: fader; }
.pl, .pr { display: grid; justify-items: center; gap: 8px; }

/* platters: knurled rim, spinning vinyl, a tonearm that drops onto the record while playing */
.platter { position: relative; width: var(--s); aspect-ratio: 1; border-radius: 50%; }
.platter::before {
  content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 50%;
  background:
    conic-gradient(from 210deg, rgba(255, 255, 255, .32), transparent 16%, rgba(255, 255, 255, .22) 50%, transparent 66%, rgba(255, 255, 255, .32)),
    repeating-conic-gradient(#4d4566 0 2deg, #1a1525 2deg 4deg);
  box-shadow:
    0 calc(var(--s) * .035) 0 #05030a,
    0 calc(var(--s) * .08) calc(var(--s) * .12) rgba(0, 0, 0, .85),
    0 0 calc(var(--s) * .18) var(--led);
}
.platter::after {
  content: ""; position: absolute; inset: 6%; z-index: 2; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, transparent 0 30%, rgba(255, 255, 255, .1) 38%, transparent 46% 80%, rgba(255, 255, 255, .08) 88%, transparent 96%);
}
.disc {
  position: absolute; inset: 6%; z-index: 1; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, #17121f 0 1.5px, #0a0810 1.5px 3.5px);
  box-shadow: inset 0 0 0 2px #000, inset 0 0 calc(var(--s) * .08) #000;
}
.disc .lab { position: absolute; inset: 32%; border-radius: 50%; background: conic-gradient(from 20deg, var(--violet), var(--accent), #ff8a3d, var(--accent), var(--violet)); }
.disc .lab::after { content: ""; position: absolute; inset: 41%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9a92b5, #2a2438 70%); }
.disc .mark { position: absolute; left: 50%; top: 5%; width: 3px; height: 13%; margin-left: -1.5px; border-radius: 2px; background: #fff; opacity: .85; }
.arm {
  position: absolute; z-index: 3;
  top: calc(var(--s) * -.02); right: calc(var(--s) * -.1);
  width: calc(var(--s) * .035); height: calc(var(--s) * .72);
  border-radius: 99px;
  background: linear-gradient(90deg, #5d5578, #e2dcf5 45%, #5d5578);
  box-shadow: calc(var(--s) * .03) calc(var(--s) * .05) calc(var(--s) * .04) rgba(0, 0, 0, .7);
  transform-origin: 50% calc(var(--s) * .06);
  transform: rotate(6deg);
  transition: transform .9s cubic-bezier(.4, 0, .2, 1);
}
.arm::before {
  content: ""; position: absolute; left: 50%; top: calc(var(--s) * .06);
  width: calc(var(--s) * .17); aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 30%, #9a92b5, #2a2438 70%);
  box-shadow: 0 calc(var(--s) * .02) calc(var(--s) * .04) rgba(0, 0, 0, .8), inset 0 0 0 1px #000;
}
.arm::after {
  content: ""; position: absolute; left: 50%; bottom: calc(var(--s) * -.05);
  width: calc(var(--s) * .07); height: calc(var(--s) * .12); border-radius: 2px;
  transform: translateX(-50%) rotate(18deg);
  background: linear-gradient(180deg, #d4cde9, #6a6288);
}
body.playing .arm { transform: rotate(26deg); }
.silk { font: 500 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); text-shadow: 0 1px 0 #000; }

/* recessed screens: a dark glass pane set into a raised bezel */
.vu, .lcd, textarea {
  background: #05030a;
  box-shadow:
    inset 0 0 18px rgba(0, 0, 0, .9), inset 0 2px 4px #000,
    0 0 0 4px #17121f, 0 0 0 5px #352b4c, 0 4px 0 5px #07050b, 0 10px 18px 4px rgba(0, 0, 0, .55);
}
.vu { justify-self: center; width: 96px; height: var(--s); padding: 6px; border-radius: 9px; }
.vu canvas { display: block; width: 100%; height: 100%; }

/* pads: rubber caps with real travel */
.pads { display: grid; gap: 12px 10px; align-content: start; }
.pads.trans { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pads.load { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 860px) { .pads.trans { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pad {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 8px;
  font: 600 11px/1.15 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--fg);
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, .1), transparent 60%),
    linear-gradient(180deg, #2a2339, #17121f);
  border: 1px solid #3c3155; border-radius: 10px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -3px 6px rgba(0, 0, 0, .35),
    0 1px 0 #1c1628, 0 2px 0 #191424, 0 3px 0 #161120, 0 4px 0 #130f1c, 0 5px 0 #100c17,
    0 6px 2px rgba(0, 0, 0, .7), 0 12px 18px -6px rgba(0, 0, 0, .9);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .6);
  cursor: pointer; text-align: center;
  transition: transform .08s, box-shadow .08s, border-color .15s;
}
.pad:hover { border-color: #5a4b78; }
.pad:active {
  transform: translateY(4px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -2px 5px rgba(0, 0, 0, .35),
    0 1px 0 #161120, 0 2px 1px rgba(0, 0, 0, .7), 0 4px 8px -3px rgba(0, 0, 0, .9);
}
.pad:focus-visible, .pad:focus-within { outline: 2px solid var(--violet); outline-offset: 3px; }
.pad .led { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #2a2239; box-shadow: inset 0 1px 1px #000; }
.pad.on .led { background: var(--led); box-shadow: 0 0 8px var(--led), 0 0 2px #fff; }
.pad.on:not(.hot) { border-color: #54447a; }
.pad.hot {
  color: var(--accent-ink); text-shadow: 0 1px 0 rgba(255, 255, 255, .3);
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, .38), transparent 60%),
    linear-gradient(180deg, #ff5fac, #e0287d);
  border-color: #ff9bcb;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -3px 6px rgba(120, 0, 50, .35),
    0 1px 0 #b81f66, 0 2px 0 #a51b5b, 0 3px 0 #921750, 0 4px 0 #7e1345, 0 5px 0 #6a0f3a,
    0 6px 2px rgba(0, 0, 0, .7), 0 12px 18px -6px rgba(0, 0, 0, .9);
}
.pad.hot:active {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -2px 5px rgba(120, 0, 50, .35),
    0 1px 0 #921750, 0 2px 1px rgba(0, 0, 0, .7), 0 4px 8px -3px rgba(0, 0, 0, .9), 0 0 22px rgba(255, 61, 154, .45);
}
.pad.hot .led { background: rgba(23, 2, 12, .35); }
.pad.hot.on {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -3px 6px rgba(120, 0, 50, .35),
    0 1px 0 #b81f66, 0 2px 0 #a51b5b, 0 3px 0 #921750, 0 4px 0 #7e1345, 0 5px 0 #6a0f3a,
    0 6px 2px rgba(0, 0, 0, .7), 0 12px 18px -6px rgba(0, 0, 0, .9), 0 0 28px rgba(255, 61, 154, .6);
}
.pad.hot.on .led { background: #fff; box-shadow: 0 0 8px #fff; }
.pad.sm { min-height: 40px; padding: 0 14px; }
.pad.wide { grid-column: 1 / -1; min-height: 42px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }
.status { grid-column: 1 / -1; margin: 2px 0 0; font: 400 11px/1.55 var(--mono); color: var(--muted); }
.status.err { color: var(--danger); }
.tip { grid-column: 1 / -1; margin: 0; font: 400 11px/1.55 var(--mono); color: var(--muted); }

/* waveform display */
.lcd {
  --tlh: 56px;
  position: relative; height: var(--tlh); overflow: hidden;
  border: 1px solid #000; border-radius: 8px;
}
@media (min-width: 860px) { .lcd { --tlh: 72px; } }
.lcd canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lcd::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(165deg, rgba(255, 255, 255, .09), transparent 38%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px);
}
.lcd input {
  position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0;
  background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.lcd:focus-within { outline: 2px solid var(--violet); outline-offset: 7px; }
.lcd input:focus { outline: none; }
.lcd input::-webkit-slider-runnable-track { height: 100%; background: transparent; }
.lcd input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: var(--tlh); border: 0; border-radius: 0;
  background: linear-gradient(90deg, transparent 4px, #fff 4px, #fff 7px, transparent 7px);
}
.lcd input::-moz-range-track { height: 100%; background: transparent; }
.lcd input::-moz-range-thumb {
  width: 12px; height: var(--tlh); border: 0; border-radius: 0;
  background: linear-gradient(90deg, transparent 4px, #fff 4px, #fff 7px, transparent 7px);
}
.time { display: flex; justify-content: space-between; margin-top: 10px; font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* lyrics screen */
.shead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
textarea {
  display: block; width: 100%; min-height: 92px; resize: vertical;
  padding: 10px 12px; color: #dcd0ff; caret-color: var(--accent);
  border: 1px solid #000; border-radius: 8px;
  font: 400 12.5px/1.65 var(--mono);
}
textarea:focus-visible { outline: 2px solid var(--violet); outline-offset: 7px; }
@media (min-width: 860px) { textarea { min-height: 110px; } }
.hint { margin: 12px 0 0; font: 400 11px/1.55 var(--mono); color: var(--muted); }

/* pop fader: a chunky cap riding in a slot cut into the board */
.fader {
  padding: 12px 14px 8px; border-radius: 12px;
  background: #08060d;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, .9), inset 0 0 0 1px #1d1729, 0 1px 0 rgba(255, 255, 255, .05);
}
.fhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.fhead label { font: 500 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.fhead output { font: 500 12px/1 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.fader input {
  --p: 33%;
  display: block; width: 100%; height: 42px; margin: 0; background: transparent;
  -webkit-appearance: none; appearance: none; cursor: pointer;
}
.fader input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 6px; }
.fader input::-webkit-slider-runnable-track {
  height: 10px; border-radius: 5px;
  background: linear-gradient(90deg, var(--accent) var(--p), #030206 var(--p));
  box-shadow: inset 0 2px 3px #000, 0 1px 0 rgba(255, 255, 255, .07), 0 0 14px -3px rgba(255, 61, 154, .6);
}
.fader input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 34px; height: 28px; margin-top: -11px;
  border: 1px solid #6a5a8c; border-radius: 6px;
  background:
    linear-gradient(90deg, transparent 15px, #fff 15px, #fff 17px, transparent 17px),
    repeating-linear-gradient(180deg, rgba(255, 255, 255, .1) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #4a3e66, #1e1830);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 1px 0 #120e1b, 0 2px 0 #100c18, 0 3px 0 #0d0a14, 0 4px 0 #0a0810, 0 8px 10px rgba(0, 0, 0, .8);
}
.fader input::-moz-range-track { height: 10px; border-radius: 5px; background: #030206; box-shadow: inset 0 2px 3px #000; }
.fader input::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--accent); }
.fader input::-moz-range-thumb {
  width: 34px; height: 28px; border: 1px solid #6a5a8c; border-radius: 6px;
  background:
    linear-gradient(90deg, transparent 15px, #fff 15px, #fff 17px, transparent 17px),
    repeating-linear-gradient(180deg, rgba(255, 255, 255, .1) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #4a3e66, #1e1830);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 1px 0 #120e1b, 0 2px 0 #100c18, 0 3px 0 #0d0a14, 0 4px 0 #0a0810, 0 8px 10px rgba(0, 0, 0, .8);
}
.ticks { height: 6px; margin: 2px 17px 0; background: repeating-linear-gradient(90deg, #3b3052 0 1px, transparent 1px 6.6667%); }

@media (prefers-reduced-motion: reduce) {
  .strip { animation: none; }
  body.open .stage { animation: none; }
  .cam, .deck, .chev, .pad, .exit, .arm, .stage::after { transition: none; }
}
</style>

<div class="world" id="world">
  <div class="cam" id="cam">
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Lyric stage. Press to play or pause.">
      <canvas id="cv" aria-hidden="true"></canvas>
    </div>
  </div>

  <aside class="deck" id="deck" aria-label="DJ board">
    <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
    <button class="grip" id="grip" type="button" aria-expanded="false" aria-controls="deckBody">
      <span class="strip" aria-hidden="true"></span>

const beams = Array.from({ length: 5 }, (_, i) => ({ x: (i + 0.5) / 5, ph: crand() * 6.2832, sp: 0.3 + crand() * 0.3, hs: i % 2 ? 50 : -25 }));

/* ---------- demo track (made in the browser, original words) ---------- */
const DEMO_BPM = 112, DEMO_BAR = 240 / DEMO_BPM;
const DEMO_LEVELS = [1, 1, .3, .3, .3, .3, .55, .55, .7, .7, .3, .3, 1, 1, 1, .6];
const DEMO_WORDS = ['TURN IT UP', 'FEEL THE FLOOR', 'soft light on the glass', 'the whole street holds its breath',
  'nobody says a word', 'just the hum beneath the night', "something's coming closer", 'I can feel it in my chest',
  'LOUDER NOW', 'THE WHOLE SKY SHAKES', 'and then it all goes still', 'waiting for the spark',
  'NOW SCREAM IT OUT', 'BURN THE NIGHT DOWN', 'WE ARE LOUD', 'WE ARE ALIVE'];

let demo = null;
function getDemo() {
  if (demo) return demo;

/* ---------- lyrics ---------- */

}

/* ---------- layout of one lyric line ---------- */
function layout(l) {

/* ---------- drawing ---------- */

      const x = p.x * W + Math.sin(time * 0.7 + p.ph) * s * 0.06;
      const y = base + s * p.dy - s * (0.03 + 0.14 * en) * Math.abs(Math.sin(time * 6.2832 + p.ph)) - s * 0.3 * hop;
      // a few phones stay up between songs; everyone else throws their hands up as it gets loud
      p.up += ((p.arm < 0.06 || en > 0.3 + p.arm * 0.6 ? 1 : 0) - p.up) * k;
      body.moveTo(x + s * 0.21, y - s * 0.3);
      body.ellipse(x, y - s * 0.3, s * 0.21, s * 0.25, 0, 0, 6.2832);
      body.moveTo(x - s / 2, H + s); body.lineTo(x - s / 2, y + s * 0.35);
      body.quadraticCurveTo(x - s / 2, y, x - s * 0.18, y); body.lineTo(x + s * 0.18, y);
      body.quadraticCurveTo(x + s / 2, y, x + s / 2, y + s * 0.35); body.lineTo(x + s / 2, H + s); body.closePath();
      if (p.up < 0.03) continue;
      for (const sd of p.both ? [-1, 1] : [p.side]) {
        const hx = x + sd * s * (0.45 + 0.14 * Math.sin(time * 3 + p.ph)), hy = y - s * (0.1 + 1.05 * p.up);
        arms.moveTo(x + sd * s * 0.34, y + s * 0.14);
        arms.quadraticCurveTo(x + sd * s * 0.62, y - s * 0.2 * p.up, hx, hy);
        if (p.phone && sd === p.side && p.up > 0.6) phones.push(hx, hy, s);
      }
    }
    // a rim of stage light along heads and shoulders, then the silhouettes; the back rows sit in more haze
    g.lineWidth = s0 * 0.15;
    g.save(); g.translate(0, -Math.max(1, s0 * 0.05));
    g.fillStyle = g.strokeStyle = 'hsla(' + hue + ',100%,64%,' + ((0.3 + 0.45 * en) * (0.35 + 0.65 * d)) + ')';
    g.fill(body); g.stroke(arms);
    g.restore();
    g.fillStyle = g.strokeStyle = 'hsl(' + ((hue + 20) % 360) + ',30%,' + (2 + 9 * (1 - d)) + '%)';
    g.fill(body); g.stroke(arms);
    for (let i = 0; i < phones.length; i += 3) {
      const px = phones[i], py = phones[i + 1], ps = phones[i + 2];
      g.globalCompositeOperation = 'lighter';
      const gl = g.createRadialGradient(px, py - ps * 0.17, 0, px, py - ps * 0.17, ps * 0.7);
      gl.addColorStop(0, 'rgba(200,220,255,.35)'); gl.addColorStop(1, 'rgba(200,220,255,0)');
      g.fillStyle = gl; g.fillRect(px - ps * 0.7, py - ps * 0.87, ps * 1.4, ps * 1.4);
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = 'rgba(232,240,255,.95)'; g.fillRect(px - ps * 0.08, py - ps * 0.3, ps * 0.16, ps * 0.26);
    }
  }
}
function drawFX(dt) {
  g.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = (time - r.t) / 0.9;
    if (age >= 1) { rings.splice(i, 1); continue; }
    g.strokeStyle = 'hsla(' + r.hue + ',100%,65%,' + ((1 - age) * 0.45 * r.s) + ')';
    g.lineWidth = 1.5 + 7 * (1 - age);
    g.beginPath(); g.arc(W / 2, H * 0.47, Math.min(W, H) * (0.1 + 0.6 * easeOutCubic(age)), 0, 6.2832); g.stroke();
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vx *= 1 - 1.6 * dt; p.vy = p.vy * (1 - 1.6 * dt) - 18 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const al = 1 - p.life / p.max;
    g.fillStyle = 'hsla(' + p.hue + ',100%,66%,' + (al * 0.9) + ')';
    g.beginPath(); g.arc(p.x, p.y, p.r * (0.6 + al), 0, 6.2832); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}
function drawWord(w, a, am, dy) {
  if (a < 0) return;
  const p = clamp(a / 0.34, 0, 1);
  const s = easeOutBack(p) * (1 + 0.34 * w.lw * Math.exp(-Math.min(a, 50) * 6.5)) * (1 + 0.09 * live * (0.4 + w.lw));
  if (s < 0.02) return;
  const size = w.size, hue = hueOf(w.lw);
  const dx = Math.sin(time * 0.9 + w.i * 1.7) * size * 0.05, dyy = Math.cos(time * 0.7 + w.i * 1.1) * size * 0.06;
  const rot = (1 - easeOutCubic(p)) * 0.14 * (w.i % 2 ? 1 : -1);
  const x0 = -w.w / 2, amp = 0.015 + 0.085 * live * w.lw + 0.02 * (1 - w.lw), soft = 0.72 + 0.28 * w.lw;
  g.save();
  g.translate(w.x + dx, w.y + dy + dyy); g.rotate(rot); g.scale(s, s);
  g.font = w.weight + ' ' + size + 'px ' + FONT; g.textBaseline = 'middle'; g.textAlign = 'left';
  const pass = (k, alpha) => {
    const tt = time - k * 0.08;
    for (let i = 0; i < w.chars.length; i++) {
      const la = clamp((a - i * 0.03) / 0.3, 0, 1);
      if (la <= 0) continue;
      g.globalAlpha = am * la * alpha * soft;
      g.fillText(w.chars[i], x0 + w.xs[i], Math.sin(tt * 2.4 + i * 0.75 + w.i) * size * amp + (1 - la) * (1 - la) * size * 0.55);
    }
  };
  const nt = Math.round(3 * w.lw * (0.4 + live));
  g.globalCompositeOperation = 'lighter';
  for (let k = nt; k >= 1; k--) {
    g.fillStyle = 'hsl(' + ((hue + k * 14) % 360) + ',100%,58%)';
    g.save(); g.scale(1 + k * 0.035, 1 + k * 0.035); pass(k, 0.22 / (1 + k * 0.3)); g.restore();
  }
  g.globalCompositeOperation = 'source-over';
  g.shadowColor = 'hsl(' + hue + ',100%,58%)'; g.shadowBlur = (6 + 40 * w.lw * (0.5 + live)) * dpr;
  g.fillStyle = 'hsl(' + hue + ',' + (55 + 45 * w.lw) + '%,' + (72 + 18 * w.lw) + '%)';
  pass(0, 1);
  g.restore();
}

/* ---------- waveform display ---------- */
let cols = new Float32Array(0), tlW = 300, tlH = 56, tlDpr = 1;
function computeCols() {
  tlW = Math.max(1, tl.clientWidth); tlH = Math.max(1, tl.clientHeight); tlDpr = Math.min(window.devicePixelRatio || 1, 2);
  tl.width = Math.round(tlW * tlDpr); tl.height = Math.round(tlH * tlDpr);
  const n = Math.max(8, Math.floor(tlW / 5));
  cols = new Float32Array(n);
  if (!track) return;
  for (let i = 0; i < n; i++) cols[i] = maxNorm(i / n * track.duration, (i + 1) / n * track.duration);
}
function drawTL(t) {
  tg.setTransform(tlDpr, 0, 0, tlDpr, 0, 0);
  tg.clearRect(0, 0, tlW, tlH);
  const n = cols.length, bw = tlW / n, p = track ? t / track.duration : 0;
  for (let i = 0; i < n; i++) {
    const v = cols[i], hh = 3 + v * (tlH - 12), played = (i + 0.5) / n <= p;
    tg.fillStyle = 'hsl(' + hueOf(v) + ',90%,' + (played ? 66 : 38) + '%)';
    tg.fillRect(i * bw + 1, (tlH - hh) / 2, Math.max(1, bw - 2), hh);
  }
}

/* ---------- VU meters ---------- */
let vuW = 84, vuH = 72, vuDpr = 1;
const vuPk = [0, 0];
function sizeVU() {
  vuW = Math.max(1, vu.clientWidth); vuH = Math.max(1, vu.clientHeight); vuDpr = Math.min(window.devicePixelRatio || 1, 2);
  vu.width = Math.round(vuW * vuDpr); vu.height = Math.round(vuH * vuDpr);
}
function drawVU(dt) {
  vg.setTransform(vuDpr, 0, 0, vuDpr, 0, 0);
  vg.clearRect(0, 0, vuW, vuH);
  const N = 16, gap = 2, segH = (vuH - gap * (N - 1)) / N, colW = vuW * 0.3, src0 = playing ? live : 0;
  for (let c = 0; c < 2; c++) {
    const lv = clamp(src0 * (c ? 0.94 : 1) + Math.sin(time * 13 + c * 2.1) * 0.05 * src0, 0, 1);
    vuPk[c] = Math.max(lv, vuPk[c] - dt * 0.5);
    const x = vuW * (c ? 0.56 : 0.14);
    for (let i = 0; i < N; i++) {
      const y = vuH - (i + 1) * segH - i * gap;
      vg.fillStyle = (i + 0.5) / N <= lv ? 'hsl(' + hueOf(i / (N - 1)) + ',95%,58%)' : 'rgba(255,255,255,0.07)';
      vg.fillRect(x, y, colW, segH);
    }
    if (vuPk[c] > 0.05) {
      const pi = Math.min(N - 1, Math.floor(vuPk[c] * N));
      vg.fillStyle = '#fff'; vg.fillRect(x, vuH - (pi + 1) * segH - pi * gap, colW, segH);
    }
  }
}

/* ---------- main loop ---------- */
const clean = () => document.body.classList.contains('clean');
const isOpen = () => document.body.classList.contains('open');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const t = track ? songTime() : 0;
  if (t < lastT - 0.05) resetFlags();
  lastT = t;
  const inst = track ? normAt(t) : 0, target = inst * (playing ? 1 : 0.4);
  live += (target - live) * (1 - Math.exp(-dt * (target > live ? 30 : 6)));
  flow += dt * (0.5 + live * 1.6);
  if (playing && inst - prevTarget > 0.12 && inst > 0.55 && time - lastRing > 0.22) {
    rings.push({ t: time, hue: hueOf(inst), s: inst }); lastRing = jumpT = time; shake = 9 * inst;
  }
  prevTarget = inst;
  shake *= Math.exp(-dt * 14);

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBG();
  if (crowdOn) drawCrowd(dt);
  drawFX(dt);

  g.save();
  if (shake > 0.3) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (lines.length) {
    const idx = lineIndexAt(t);
    if (idx !== shownIdx) {
      if (playing && shownIdx >= 0 && idx > shownIdx && idx - shownIdx < 3) ghost = { line: lines[shownIdx], t0: time };
      shownIdx = idx;
    }
    if (ghost) {
      const k = (time - ghost.t0) / 0.5;
      if (k >= 1) ghost = null;
      else { layout(ghost.line); for (const w of ghost.line.words) drawWord(w, 99, 1 - k, -k * H * 0.07); }
    }
    if (idx >= 0) {
      const l = lines[idx];
      if (l.words.length && t <= l.t + l.hold) {
        layout(l);
        for (const w of l.words) {
          const a = playing ? t - w.t0 : 99;
          if (playing && a >= 0 && !w._p && a < 0.25) { w._p = true; if (w.lw > 0.4) burst(w); }
          drawWord(w, a, 1, 0);
        }
      }
    }
  } else {
    g.fillStyle = 'rgba(242,238,252,0.55)'; g.font = '300 ' + clamp(W * 0.05, 14, 22) + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('Open the DJ board and paste lyrics', W / 2, H * 0.47);
  }
  g.restore();

  if (!playing) {
    g.fillStyle = 'rgba(242,238,252,0.5)'; g.font = '500 11px ' + MONO;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('TAP TO PLAY', W / 2, H - 28);
  }

  const sec = Math.floor(t);
  if (sec !== lastSec) { lastSec = sec; $('tNow').textContent = fmt(t); }
  if (!scrubbing && track) seek.value = t;

  if (!clean()) {
    const h = hueOf(live);
    deck.style.setProperty('--led', 'hsl(' + h + ',100%,62%)');
    deck.style.setProperty('--spill', 'hsla(' + h + ',100%,60%,' + (0.1 + 0.4 * live) + ')');
    // the platters and meters peek out even with the board closed
    spin = (spin + dt * (playing ? 120 + 300 * live : 0)) % 360;
    discL.style.transform = 'rotate(' + spin + 'deg)';
    discR.style.transform = 'rotate(' + (spin * 0.93) + 'deg)';
    drawVU(dt);
    if (isOpen()) drawTL(t);
  }
}

/* ---------- sizing + camera ---------- */
// Where the open board's top edge lands on screen: it is tipped back on its bottom edge, so it recedes and sits a little lower.
function updateLift() {
  const cs = getComputedStyle(world), P = parseFloat(cs.perspective) || 1000, oy = parseFloat(cs.perspectiveOrigin.split(' ')[1]);
  const th = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tilt-open')) * Math.PI / 180;
  const vh = world.clientHeight, dh = deck.offsetHeight;
  const top = oy + (vh - dh * Math.cos(th) - oy) * P / (P + dh * Math.sin(th));
  const lift = Math.max(0, parseFloat(cs.paddingTop) + 0.47 * cam.offsetHeight - top / 2);
  document.documentElement.style.setProperty('--lift', (-lift) + 'px');
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w < 2 || h < 2) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  epoch++;
}
new ResizeObserver(resize).observe(stage);
new ResizeObserver(computeCols).observe($('tlWrap'));
new ResizeObserver(sizeVU).observe(vu);
new ResizeObserver(() => { if (isOpen()) updateLift(); }).observe(deck);
window.addEventListener('resize', () => { if (isOpen()) updateLift(); });

function setDeck(on) {
  if (clean()) on = false;
  if (on) updateLift();
  document.body.classList.toggle('open', on);
  grip.setAttribute('aria-expanded', on ? 'true' : 'false');
  gripTx.textContent = on ? 'Back to the crowd' : 'DJ board';
  deckBody.inert = !on;
  if (!on) deckBody.scrollTo({ top: 0, behavior: 'smooth' });
}
grip.addEventListener('click', () => setDeck(!isOpen()));
deck.addEventListener('click', e => { if (!isOpen() && !grip.contains(e.target)) setDeck(true); });

/* ---------- controls ---------- */
playBtn.addEventListener('click', togglePlay);
restartBtn.addEventListener('click', () => { seekTo(0); play(); });
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (gain) gain.gain.value = soundOn ? 1 : 0;
  soundBtn.classList.toggle('on', soundOn);
  soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
});
crowdBtn.addEventListener('click', () => {
  crowdOn = !crowdOn;
  crowdBtn.classList.toggle('on', crowdOn);
  crowdBtn.setAttribute('aria-pressed', crowdOn ? 'true' : 'false');
});
demoBtn.addEventListener('click', () => {
  const d = getDemo(); setTrack(d, demoLrc);
  setStatus('Demo track · ' + fmt(d.duration) + ' · made in your browser with original words');
});
applyBtn.addEventListener('click', () => {
  applyLyrics();
  setStatus((track ? track.name + ' · ' : '') + lines.filter(l => l.text).length + ' lyric lines applied');
});
popEl.addEventListener('input', () => {
  strength = +popEl.value; popOut.textContent = strength.toFixed(1) + '×'; epoch++;
  popEl.style.setProperty('--p', ((strength - 0.5) / 1.5 * 100) + '%');
});
fileIn.addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  setStatus('Reading ' + f.name + '…');
  try {
    const raw = await f.arrayBuffer();
    const ab = await getCtx().decodeAudioData(raw);
    const chs = Array.from({ length: ab.numberOfChannels }, (_, i) => ab.getChannelData(i));
    const keep = lyricsEl.value.trim() && lyricsEl.value !== demoLrc;
    setTrack({ name: f.name, duration: ab.duration, ab, chs, sr: ab.sampleRate }, keep ? undefined : '');
    setStatus(f.name + ' · ' + fmt(ab.duration) + (keep ? '' : ' · paste its lyrics below, then press Apply'));
  } catch (err) {
    setStatus('Could not read that file. Try an MP3, M4A or WAV.', true);
  }
  fileIn.value = '';
});

seek.addEventListener('pointerdown', () => { scrubbing = true; wasPlaying = playing; if (playing) pause(); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; resetFlags(); if (wasPlaying) play(); };
seek.addEventListener('pointerup', endScrub);
seek.addEventListener('pointercancel', endScrub);
seek.addEventListener('input', () => { const v = +seek.value; if (scrubbing) pausedAt = v; else seekTo(v); });

let exitTimer = 0;
function showExit() {
  exitBtn.classList.add('show'); clearTimeout(exitTimer);
  exitTimer = setTimeout(() => exitBtn.classList.remove('show'), 2500);
}
function setClean(on) {
  if (on) setDeck(false);
  document.body.classList.toggle('clean', on);
  exitBtn.hidden = !on;
  if (on) { window.scrollTo(0, 0); showExit(); }
  else { clearTimeout(exitTimer); exitBtn.classList.remove('show'); computeCols(); sizeVU(); }
}
cleanBtn.addEventListener('click', () => setClean(true));
exitBtn.addEventListener('click', () => setClean(false));
stage.addEventListener('click', () => { togglePlay(); if (clean()) showExit(); });
stage.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePlay(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (clean()) setClean(false); else if (isOpen()) setDeck(false);
});

/* ---------- start ---------- */
resize();
sizeVU();
popEl.style.setProperty('--p', ((strength - 0.5) / 1.5 * 100) + '%');
const d0 = getDemo();
setTrack(d0, demoLrc);
setStatus('Demo track · ' + fmt(d0.duration) + ' · made in your browser with original words');
Promise.all([document.fonts.load('300 40px "Bricolage Grotesque"'), document.fonts.load('800 40px "Bricolage Grotesque"'), document.fonts.load('500 12px "DM Mono"')])
  .then(() => { epoch++; }).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
